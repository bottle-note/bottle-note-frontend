name: Product preview image

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]
    branches: [main]

concurrency:
  group: product-preview-deploy
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  IMAGE_NAME: bottlenote-frontend-preview
  PREVIEW_CHANNEL_TAG: frontend_latest_preview

jobs:
  transfer-preview-label:
    name: transfer preview deployment label
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview-deploy') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview-deploy')
    runs-on: ubuntu-latest
    steps:
      - name: remove preview deployment label from other open pull requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const currentNumber = context.payload.pull_request.number;
            const currentUrl = context.payload.pull_request.html_url;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            for (const pull of pulls) {
              if (pull.number === currentNumber || !pull.labels.some(({ name }) => name === 'preview-deploy')) continue;
              await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pull.number, name: 'preview-deploy' });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body: `Preview deployment was transferred to [#${currentNumber}](${currentUrl}). Tracking: [workspace#488](https://github.com/bottle-note/workspace/issues/488).`,
              });
            }

  prepare:
    name: prepare immutable image tag
    needs: transfer-preview-label
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.source.outputs.short-sha }}
    steps:
      - id: source
        name: derive immutable source tag
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "short-sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-preview-image:
    name: build and sign immutable preview image
    needs: prepare
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.image-digest }}
    steps:
      - name: checkout trusted signing material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: .trusted
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          persist-credentials: false

      - name: checkout pull request source without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .source
          submodules: false
          persist-credentials: false

      - name: build, sign, and verify immutable preview image
        id: build
        uses: bottle-note/bottle-note-frontend/.github/actions/docker-build-push@2f676cc70abc64f87bb5486115560f30c63d6fe9
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: frontend_preview_pr-${{ github.event.pull_request.number }}_${{ needs.prepare.outputs.short-sha }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          source-ref: refs/pull/${{ github.event.pull_request.number }}/head
          context: .source
          dockerfile: .source/Dockerfile.preview
          cache-scope: frontend-preview
          cache-export: 'true'
          build-args: |
            APP_ORIGIN=https://preview.development.bottle-note.com
            INTERNAL_SERVER_URL=http://product-api
          # Required by the pinned action; Dockerfile.preview never mounts it.
          sops-age-key: preview-build-has-no-sops-secret
          env-file: preview-build-has-no-sops.env
          sign-image: 'true'
          cosign-key-path: .trusted/git.environment-variables/storage/docker-registry/cosign.key
          cosign-public-key-path: .trusted/git.environment-variables/storage/docker-registry/cosign.pub
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  promote-preview-channel:
    name: promote current preview owner
    needs: [prepare, build-preview-image]
    runs-on: ubuntu-latest
    steps:
      - name: verify live preview ownership
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const ownsPreview = pull.state === 'open' && pull.labels.some(({ name }) => name === 'preview-deploy');
            if (!ownsPreview) core.setFailed('This pull request no longer owns the preview-deploy label.');

      - name: checkout trusted public signing key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: .trusted
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          persist-credentials: false

      - name: login to private registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ secrets.REGISTRY_ADDRESS }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: setup docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.2.4

      - name: re-confirm preview ownership immediately before promotion
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pr.labels.some((label) => label.name === 'preview-deploy')) {
              core.setFailed('Preview ownership changed before channel promotion.');
            }

      - name: promote verified digest to preview channel
        env:
          IMAGE: ${{ secrets.REGISTRY_ADDRESS }}/${{ env.IMAGE_NAME }}
          EXPECTED_DIGEST: ${{ needs.build-preview-image.outputs.image-digest }}
          PUBLIC_KEY: ${{ github.workspace }}/.trusted/git.environment-variables/storage/docker-registry/cosign.pub
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::invalid image digest'; exit 1; }
          cosign verify --key "$PUBLIC_KEY" --insecure-ignore-tlog "${IMAGE}@${EXPECTED_DIGEST}" >/dev/null
          docker buildx imagetools create --tag "${IMAGE}:${PREVIEW_CHANNEL_TAG}" "${IMAGE}@${EXPECTED_DIGEST}"
          channel_digest="$(docker buildx imagetools inspect "${IMAGE}:${PREVIEW_CHANNEL_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$channel_digest" == "$EXPECTED_DIGEST" ]] || { echo '::error::preview channel digest verification failed'; exit 1; }
          {
            echo '## Product preview handoff'
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Channel: \`${PREVIEW_CHANNEL_TAG}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo '- Signature and channel digest verification: `passed`'
            echo '- Social provider credentials are intentionally unavailable in preview.'
          } >> "$GITHUB_STEP_SUMMARY"
