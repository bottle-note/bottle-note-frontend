name: Deploy Development

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      short-sha: ${{ steps.image-tag.outputs.short-sha }}

    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: generate image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=frontend_dev_${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: build and push docker image
        uses: ./.github/actions/docker-build-push
        with:
          registry-url: ${{ secrets.REGISTRY_ADDRESS }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image-name: bottlenote-frontend
          image-tag: ${{ steps.image-tag.outputs.tag }}
          additional-tags: frontend_latest_development
          cache-scope: frontend-development
          sops-age-key: ${{ secrets.SOPS_AGE_SECRET_KEY }}
          env-file: git.environment-variables/application.next-js/dev.sops.env
          sign-image: 'true'
          cosign-key-path: git.environment-variables/storage/docker-registry/cosign.key
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
